name: Behja
description: >-
  Behja (Behja Holdings Limited Inc) is a licensed real estate platform in Saudi
  Arabia (License 120022677) that offers flexible rental-to-own housing. Its model
  lets residents select a property, apply, sign a three-year lease, and then buy
  with a full year's rent credited back toward the purchase. The integrated platform
  handles leases, purchases, and utility payments in one place. Behja is a portfolio
  company of 500 Global and was added to the API Evangelist network as a company
  profile; it does not currently publish a public developer program, API, SDKs, or
  technical documentation.
